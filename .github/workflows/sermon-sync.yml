# Keep the Home page's featured sermon current: read the public "Sunday Sermons" playlist and write docs/data/sermons.json.
# No secrets needed. Runs every two hours on Sundays and Mondays (when new sermons go up) and twice a day the rest of the week.
name: Sermon sync

on:
  schedule:
    - cron: "41 */2 * * 0,1"
    - cron: "41 3,15 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read the newest sermons
        run: python3 scripts/sermon_sync.py
      - name: Commit if anything changed
        run: |
          git config user.name "springs-sermon-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sermons.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Sermon sync: newest sermons"
          git pull --rebase --quiet origin main
          git push --quiet origin HEAD:main
